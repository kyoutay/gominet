---
layout: default
---
<article>
  <h1>{{ page.title }}</h1>
  <p class="post-meta">
    {{ page.date | date: "%Y-%m-%d" }}
    {% if page.tags and page.tags.size > 0 %}
      | tags:
      {% for tag in page.tags %}
        <a href="{{ '/?tag=' | append: tag | relative_url }}">{{ tag }}</a>{% unless forloop.last %}, {% endunless %}
      {% endfor %}
    {% endif %}
  </p>

  <div>
    {{ content }}
  </div>

  <p><a href="{{ '/' | relative_url }}">&larr; back</a></p>
</article>
